name: Lint with Vale

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    name: Vale Prose Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          files: '["src/content/docs", "README.md", "CONTRIBUTING.md"]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
