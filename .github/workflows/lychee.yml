name: Check Links with Lychee

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-checker:
    name: Check Broken Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lychee Action
        uses: lycheeverse/lychee-action@v2
        with:
          args: --exclude-loopback --exclude-mail --exclude-path node_modules --exclude-path dist './**/*.md' './**/*.mdx'
          fail: true
